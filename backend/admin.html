<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kicks Mtaani Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1 { color: #cc5500; margin-bottom: 8px; }
    p.subtitle { color: #888; margin-bottom: 40px; }

    /* ── ADD PRODUCT FORM ── */
    .form-section {
      background: #1a1a1a;
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 40px;
      border: 1px solid #2a2a2a;
    }

    .form-section h2 {
      color: #cc5500;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #888;
    }

    .form-group input,
    .form-group textarea {
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #cc5500;
    }

    .form-group textarea { resize: vertical; height: 80px; }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: #cc5500; color: #fff; }
    .btn-primary:hover { background: #e8590c; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: #d4a017; color: #000; }
    .btn-warning:hover { background: #b8860b; }

    /* ── PRODUCT TABLE ── */
    .products-section h2 {
      color: #cc5500;
      margin-bottom: 20px;
      font-size: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
    }

    thead {
      background: #cc5500;
      color: #fff;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #2a2a2a;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover { background: #222; }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-green { background: #14532d; color: #4ade80; }
    .badge-red { background: #450a0a; color: #f87171; }

    .actions { display: flex; gap: 8px; }

    /* ── TOAST NOTIFICATION ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #cc5500;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <h1>Kicks Mtaani Admin</h1>
  <p class="subtitle">Manage your products — add, edit, delete.</p>

  <!-- ADD PRODUCT FORM -->
  <div class="form-section">
    <h2>Add New Product</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="new-name" placeholder="e.g. Nike Kyrie 5" />
      </div>
      <div class="form-group">
        <label>Price (KSh) *</label>
        <input type="number" id="new-price" placeholder="e.g. 1300" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="new-description" placeholder="Short description..."></textarea>
      </div>
    </div>
    <button class="btn btn-primary" onclick="addProduct()">Add Product</button>
  </div>

  <!-- PRODUCTS TABLE -->
  <div class="products-section">
    <h2>Current Products</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price (KSh)</th>
          <th>Description</th>
          <th>In Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="products-table">
        <tr><td colspan="6" style="text-align:center; color:#888;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api";
    const API_KEY = "kicks-admin-key-nakuru";

    // ── FETCH AND RENDER PRODUCTS ──
    async function loadProducts() {
      const res = await fetch(`${API_URL}/products`);
      const products = await res.json();
      const tbody = document.getElementById("products-table");

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No products yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>KSh ${p.price.toLocaleString()}</td>
          <td>${p.description || "—"}</td>
          <td>
            <span class="badge ${p.in_stock ? 'badge-green' : 'badge-red'}">
              ${p.in_stock ? "In Stock" : "Out of Stock"}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-warning" onclick="toggleStock(${p.id}, ${p.in_stock})">
              ${p.in_stock ? "Mark Out" : "Mark In"}
            </button>
            <button class="btn btn-danger" onclick="deleteProduct(${p.id}, '${p.name}')">
              Delete
            </button>
          </td>
        </tr>
      `).join("");
    }

    // ── ADD PRODUCT ──
    async function addProduct() {
      const name = document.getElementById("new-name").value.trim();
      const price = parseFloat(document.getElementById("new-price").value);
      const description = document.getElementById("new-description").value.trim();

      if (!name || !price) {
        showToast("Name and price are required", "error");
        return;
      }

      const res = await fetch(`${API_URL}/products`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY
        },
        body: JSON.stringify({ name, price, description, in_stock: true })
      });

      if (res.ok) {
        document.getElementById("new-name").value = "";
        document.getElementById("new-price").value = "";
        document.getElementById("new-description").value = "";
        showToast(`${name} added successfully`);
        loadProducts();
      } else {
        showToast("Failed to add product", "error");
      }
    }

    // ── TOGGLE STOCK ──
    async function toggleStock(id, currentStatus) {
      const res = await fetch(`${API_URL}/products/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY
        },
        body: JSON.stringify({ in_stock: !currentStatus })
      });

      if (res.ok) {
        showToast(`Stock status updated`);
        loadProducts();
      }
    }

    // ── DELETE PRODUCT ──
    async function deleteProduct(id, name) {
      if (!confirm(`Delete ${name}? This cannot be undone.`)) return;

      const res = await fetch(`${API_URL}/products/${id}`, {
        method: "DELETE",
        headers: { "X-API-Key": API_KEY }
      });

      if (res.ok) {
        showToast(`${name} deleted`);
        loadProducts();
      }
    }

    // ── TOAST NOTIFICATION ──
    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.background = type === "error" ? "#dc2626" : "#cc5500";
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    // Load on page open
    loadProducts();
  </script>

</body>
</html>
